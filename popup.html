<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OpenCount</title>
    <style>
      :root {
        --bg-1: #f8fafc;
        --bg-2: #eef2f7;
        --card: #ffffff;
        --ink: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #0f766e;
      }
      html,
      body {
        margin: 0;
        width: 400px;
        height: 320px;
        min-width: 380px;
        min-height: 300px;
        font-family: "Avenir Next", "Futura", "Gill Sans", sans-serif;
        background: linear-gradient(160deg, var(--bg-2), var(--bg-1));
        color: var(--ink);
      }
      * {
        box-sizing: border-box;
      }
      body {
        padding: 12px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
      }
      .hero {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .hero-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
      }
      .icon-button {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #f8fafc;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
      }
      .icon-button:hover {
        background: #eef2f7;
      }
      .icon-button svg {
        width: 14px;
        height: 14px;
        stroke: #0f172a;
      }
      .hero img {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: none;
        background: transparent;
      }
      .hero-text {
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .subtitle {
        line-height: 1.2;
      }
      h1 {
        font-size: 18px;
        margin: 0;
      }
      .subtitle {
        font-size: 12px;
        color: var(--muted);
      }
      #list {
        overflow-y: auto;
        padding-right: 2px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 10px;
      }
      .row:nth-child(even) {
        background: #f3f4f6;
      }
      .row:hover {
        background: #eef2f7;
      }
      .domain {
        font-weight: 700;
        font-size: 13px;
        word-break: break-word;
      }
      .stats {
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
        padding: 4px 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: #f8fafc;
      }
      .note {
        font-size: 11px;
        color: var(--muted);
        padding: 6px 2px;
      }
      .footer {
        margin-top: auto;
      }
      .button {
        width: 100%;
        border: 1px solid var(--border);
        background: #f8fafc;
        color: var(--ink);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .button:hover {
        background: #eef2f7;
      }
      .button-danger {
        border-color: #f1c0c0;
        background: #fff5f5;
        color: #b91c1c;
      }
      .button-danger:hover {
        background: #ffe5e5;
      }
      .settings {
        border-top: 1px solid var(--border);
        padding-top: 8px;
        font-size: 12px;
      }
      .settings summary {
        cursor: pointer;
        color: var(--muted);
      }
      .settings summary:hover {
        color: var(--ink);
      }
      .settings-body {
        margin-top: 8px;
        display: grid;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="hero">
        <img src="popup-assets/hero-40.png" alt="OpenCount icon" />
        <div class="hero-text">
          <h1>OpenCount</h1>
          <div class="subtitle">Active time by domain</div>
        </div>
        <div class="hero-actions">
          <button
            id="open-dashboard"
            class="icon-button"
            type="button"
            title="Open dashboard"
            aria-label="Open dashboard"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
              <path
                d="M14 5h5v5M10 14l9-9M5 19h14a2 2 0 0 0 2-2V9"
              />
            </svg>
          </button>
        </div>
      </div>
      <div id="list">
        <div class="note">Loading stats...</div>
      </div>
      <div class="footer">
        <details class="settings">
          <summary>Settings</summary>
          <div class="settings-body">
            <button id="show-overlay" class="button" type="button">
              Show timer on this page
            </button>
          </div>
        </details>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
